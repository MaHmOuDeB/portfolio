name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  # Needed to download the CI run's report artifacts.
  actions: read

jobs:
  deploy:
    name: Prebuilt Vercel deploy
    # Only a successful CI run for a push to main; a pull request from a fork whose branch is
    # called "main" also reports head_branch == main, so the event and the head repository are
    # checked as well.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download unit test report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report-vitest
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download e2e report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report-e2e
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download Lighthouse reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report-lhci
          path: reports/lhci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: npm run build:meta
      # Secrets are scoped to the three Vercel steps only, so npm install scripts and the artifact
      # steps never see them. LAUNCHED is normalised to exactly "true" or "false" (expressions
      # compare strings case-insensitively, the script does not); production is never deployed
      # until the repository variable LAUNCHED is "true".
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          LAUNCHED: ${{ vars.LAUNCHED == 'true' }}
        run: |
          if [ "$LAUNCHED" = "true" ]; then environment=production; else environment=preview; fi
          npx --no-install vercel pull --yes --environment="$environment" --token="$VERCEL_TOKEN"
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          LAUNCHED: ${{ vars.LAUNCHED == 'true' }}
        run: |
          if [ "$LAUNCHED" = "true" ]; then prod_flag=--prod; else prod_flag=; fi
          # shellcheck disable=SC2086
          npx --no-install vercel build $prod_flag --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          LAUNCHED: ${{ vars.LAUNCHED == 'true' }}
        run: |
          args="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/deploy-command.ts)"
          [ -n "$args" ] || { echo "deploy-command produced no arguments" >&2; exit 1; }
          # The deployment URL is the last line of stdout; progress output goes to stderr.
          # shellcheck disable=SC2086
          url="$(npx --no-install vercel $args --token="$VERCEL_TOKEN" | tail -n1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Job summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          LAUNCHED: ${{ vars.LAUNCHED == 'true' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$LAUNCHED" = "true" ]; then target=production; else target=preview; fi
          {
            echo "## Deployment"
            echo
            echo "- Target: ${target}"
            echo "- Commit: ${HEAD_SHA}"
            echo "- URL: ${DEPLOY_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
