name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  # Needed to download the CI run's report artifacts.
  actions: read

jobs:
  deploy:
    name: Prebuilt Vercel deploy
    # Only a successful CI run for a push to main; a pull request from a fork whose branch is
    # called "main" also reports head_branch == main, so the event is checked as well.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Production is never deployed until this repository variable is set to "true".
      LAUNCHED: ${{ vars.LAUNCHED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download unit test report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report-vitest
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download e2e report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report-e2e
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download Lighthouse reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report-lhci
          path: reports/lhci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: npm run build:meta
      - name: Pull Vercel environment
        run: >-
          npx vercel@62.2.0 pull --yes
          --environment=${{ vars.LAUNCHED == 'true' && 'production' || 'preview' }}
          --token=$VERCEL_TOKEN
      - name: Build
        run: >-
          npx vercel@62.2.0 build
          ${{ vars.LAUNCHED == 'true' && '--prod' || '' }}
          --token=$VERCEL_TOKEN
      - name: Deploy
        id: deploy
        run: |
          args="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/deploy-command.ts)"
          # shellcheck disable=SC2086
          url="$(npx vercel@62.2.0 $args --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Job summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Deployment"
            echo
            echo "- Target: ${{ vars.LAUNCHED == 'true' && 'production' || 'preview' }}"
            echo "- Commit: ${{ github.event.workflow_run.head_sha }}"
            echo "- URL: ${DEPLOY_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
