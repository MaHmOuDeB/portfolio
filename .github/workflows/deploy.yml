name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  # Needed to download the CI run's report artifacts.
  actions: read

jobs:
  deploy:
    name: Prebuilt Vercel deploy
    # Only a successful CI run for a push to main; a pull request from a fork whose branch is
    # called "main" also reports head_branch == main, so the event and the head repository are
    # checked as well.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # After launch only the commit named in the repository variable LAUNCH_SHA may deploy
      # production: a CI run that was queued or in flight when LAUNCHED became "true", or a re-run
      # of an older run, fails here, before the checkout and every Vercel step, and deploys nothing.
      # LAUNCH_SHA must be the full lowercase commit SHA; an empty or malformed value fails too.
      # It prints only the tested commit, LAUNCH_SHA and the decision. Previews are unchanged.
      # `shell: bash` runs it with -eo pipefail. The step must keep no `if:` or `continue-on-error`:
      # a refusal has to stop the job (tests/unit/deploy-guard.test.ts pins its keys).
      - name: Guard production SHA
        env:
          LAUNCHED: ${{ vars.LAUNCHED == 'true' }}
          LAUNCH_SHA: ${{ vars.LAUNCH_SHA }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          valid=
          if [ -z "$LAUNCH_SHA" ]; then
            shown='(empty)'
          elif [[ "$LAUNCH_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            valid=1
            shown="$LAUNCH_SHA"
          else
            shown='(not a full commit SHA)'
          fi
          echo "Tested commit (head_sha): ${HEAD_SHA}"
          echo "LAUNCH_SHA: ${shown}"
          if [ "$LAUNCHED" != "true" ]; then
            echo "Decision: preview deploy, LAUNCHED is not true"
            exit 0
          fi
          if [ -z "$valid" ]; then
            echo "Decision: refused, LAUNCH_SHA is not a full commit SHA"
            echo "::error::LAUNCHED is true but LAUNCH_SHA is not a full commit SHA; nothing is deployed."
            exit 1
          fi
          if [ "$HEAD_SHA" != "$LAUNCH_SHA" ]; then
            echo "Decision: refused, the tested commit is not LAUNCH_SHA"
            echo "::error::LAUNCHED is true and this run tested a commit other than LAUNCH_SHA; nothing is deployed."
            exit 1
          fi
          echo "Decision: production deploy allowed"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download unit test report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report-vitest
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download e2e report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report-e2e
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download Lighthouse reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: report-lhci
          path: reports/lhci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: npm run build:meta
      # Secrets are scoped to the three Vercel steps only, so npm install scripts and the artifact
      # steps never see them. LAUNCHED is normalised to exactly "true" or "false" (expressions
      # compare strings case-insensitively, the script does not); production is never deployed
      # until the repository variable LAUNCHED is "true".
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          LAUNCHED: ${{ vars.LAUNCHED == 'true' }}
        run: |
          if [ "$LAUNCHED" = "true" ]; then environment=production; else environment=preview; fi
          npx --no-install vercel pull --yes --environment="$environment" --token="$VERCEL_TOKEN"
      # The build never holds the store's write credentials (KV_REST_API_TOKEN, KV_URL, REDIS_URL),
      # only the read-only token: the wrapper builds from a copy of the pulled environment without
      # them, proves from inside every Node process of the build (Next included) that they were
      # absent, and puts the pulled file back afterwards.
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          LAUNCHED: ${{ vars.LAUNCHED == 'true' }}
        run: |
          if [ "$LAUNCHED" = "true" ]; then target=production; else target=preview; fi
          bash scripts/vercel-build-isolated.sh "$target"
      # The deploy builds on a fresh checkout with the pulled Vercel project environment, so a
      # KITCHEN_SINK variable set in the Vercel project would put the dev-only route into the
      # deployed build. `vercel build` leaves Next's output in .next, where the check reads it.
      - name: Check the build has no kitchen sink
        run: npm run assert:no-kitchen-sink
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          LAUNCHED: ${{ vars.LAUNCHED == 'true' }}
        run: |
          # Pre-deploy gate. The CLI drops --target=preview before it calls the API, so the flag
          # alone does not stop Vercel from making a project's first deployment a production one.
          # Until launch, refuse to deploy unless the project already has a production deployment
          # (any state), and fail closed if the API cannot be asked.
          if [ "$LAUNCHED" != "true" ]; then
            existing="$(curl --silent --show-error --fail --get 'https://api.vercel.com/v6/deployments' \
              --data-urlencode "projectId=$VERCEL_PROJECT_ID" --data-urlencode "teamId=$VERCEL_ORG_ID" \
              --data-urlencode 'target=production' --data-urlencode 'limit=1' \
              --header "Authorization: Bearer $VERCEL_TOKEN")" || {
              echo "Could not list production deployments; refusing to deploy." >&2
              exit 1
            }
            has_production="$(printf '%s\n' "$existing" | node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/has-production-deployment.ts)"
            if [ "$has_production" != "yes" ]; then
              echo "::error::The project has no production deployment yet, so Vercel would make this deployment production. Not deploying." >&2
              exit 1
            fi
          fi
          args="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/deploy-command.ts)"
          [ -n "$args" ] || { echo "deploy-command produced no arguments" >&2; exit 1; }
          # The deployment URL is the last line of stdout; progress output goes to stderr.
          # shellcheck disable=SC2086
          out="$(npx --no-install vercel $args --token="$VERCEL_TOKEN")"
          url="$(printf '%s\n' "$out" | tail -n1)"
          [ -n "$url" ] || { echo "vercel deploy printed no URL" >&2; exit 1; }
          # Post-deploy check (second layer, it detects rather than prevents): ask Vercel what it
          # actually created and fail closed on anything but "preview" (including no answer). If it
          # ever trips, the deployment is already live: roll back by promoting the previous one.
          if [ "$LAUNCHED" != "true" ]; then
            inspect="$(NO_COLOR=1 FORCE_COLOR=0 npx --no-install vercel inspect "$url" --token="$VERCEL_TOKEN" 2>&1)" || {
              printf '%s\n' "$inspect" >&2
              echo "vercel inspect failed; cannot verify the deployment target of $url" >&2
              exit 1
            }
            target="$(printf '%s\n' "$inspect" | node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/parse-inspect-target.ts)"
            if [ "$target" != "preview" ]; then
              printf '%s\n' "$inspect" >&2
              echo "::error::Deployment $url has target '${target:-unknown}' but the site is not launched; expected 'preview'." >&2
              exit 1
            fi
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Job summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          LAUNCHED: ${{ vars.LAUNCHED == 'true' }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$LAUNCHED" = "true" ]; then target=production; else target=preview; fi
          {
            echo "## Deployment"
            echo
            echo "- Target: ${target}"
            echo "- Commit: ${HEAD_SHA}"
            echo "- URL: ${DEPLOY_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
