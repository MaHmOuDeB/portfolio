name: CI

on:
  # `labeled` re-runs the checks when the `update-baselines` label is added (see the e2e job).
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run test:cov
      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-vitest
          path: reports/vitest.json
          if-no-files-found: error
          retention-days: 14

  stats-ref:
    name: Statistics reference data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Regenerates the reference data from the pinned scipy/statsmodels into a temporary file and
      # compares it numerically with the committed reference.json (floats within 1e-9 relative,
      # everything else exact), so a last-digit difference in a platform's math library cannot fail
      # the build while a real change in a reference value does.
      - name: Regenerate the reference data
        working-directory: stats-ref
        run: uv run --locked generate.py "$RUNNER_TEMP/reference.fresh.json"
      - name: Check reference.json is up to date
        working-directory: stats-ref
        run: uv run --locked check_reference.py reference.json "$RUNNER_TEMP/reference.fresh.json"

  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the build has no kitchen sink
        run: npm run assert:no-kitchen-sink
      - run: npm run lint:design
      # Fails if TRUTH_DENYLIST is missing; findings name a deny-list term only by its index, so
      # the public log never holds a term. The secret is not exposed to pull requests from forks,
      # where the audit fails with "TRUTH_DENYLIST missing in CI".
      - name: Truth audit
        run: npm run truth:audit
        env:
          TRUTH_DENYLIST: ${{ secrets.TRUTH_DENYLIST }}
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # The `update-baselines` label on the PR regenerates every visual baseline in this container.
      # While the label is on, updateSnapshots is 'all', so the job is green whatever the visual
      # diffs are: remove the label (and commit the reviewed baselines) before merging.
      UPDATE_BASELINES: ${{ contains(github.event.pull_request.labels.*.name, 'update-baselines') && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          HOME: /root
      # Only the JSON report is uploaded. test-results/ and playwright-report/ are deliberately
      # left out: Playwright traces record request headers, including the x-internal HMAC header.
      - name: Upload e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-e2e
          path: reports/e2e.json
          if-no-files-found: error
          retention-days: 14
      # Visual baselines, to download, review and commit (never generate them on a Mac). Only the
      # screenshots folder is uploaded, never test-results/ or traces.
      - name: Upload visual baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__
          if-no-files-found: warn
          retention-days: 7

  lhci:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-build
          path: .next
      - run: npm ci
      # Runs against a local `next start` (see lighthouserc.json), which has no protection, so no
      # LHCI_EXTRA_HEADERS is set and no secret can end up in the uploaded reports.
      - run: npm run lhci
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-lhci
          path: reports/lhci
          if-no-files-found: error
          retention-days: 14

  links:
    name: Link check
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-build
          path: .next
      - run: npm ci
      - name: Start the site
        run: |
          nohup npx next start -p 3123 > next-start.log 2>&1 &
          echo $! > next-start.pid
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://localhost:3123/; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready within 60 seconds" >&2
          cat next-start.log >&2
          exit 1
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml http://localhost:3123/
          fail: true
      - name: Stop the site
        if: ${{ always() }}
        run: |
          if [ -f next-start.pid ]; then
            kill "$(cat next-start.pid)" 2>/dev/null || true
          fi
