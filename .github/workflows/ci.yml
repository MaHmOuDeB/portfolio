name: CI

on:
  # `labeled` and `unlabeled` re-run the checks when the `update-baselines` label is added or removed
  # (see the e2e job): removing it must re-run CI in the normal mode, where a wrong baseline fails.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Self-hosted runners. Every job runs on the owner's self-hosted runners (the labels self-hosted,
# linux, arm64 and portfolio-mac: two runner containers on one Apple-silicon Mac, one also labelled
# portfolio-mac-1, the other portfolio-mac-2), because this private repository has no hosted-runner
# minutes left. Lighthouse is calibrated to GitHub's hosted runner (see the lhci job). deploy.yml
# stays on GitHub's runners because it holds the production secrets.
# A self-hosted runner executes whatever a workflow run checks out, so it must never serve a public
# repository or a pull request from a fork: BEFORE this repository is made public, switch these
# jobs back to `runs-on: ubuntu-24.04`, drop the container `options` caps (a 2-CPU hosted runner
# rejects `--cpus 3`), and give lhci back its plain `npm run lhci` (no CPU multiplier, no
# --no-sandbox, no container) and `needs: build`.
# On the runners, npm, uv and Python downloads are cached on each runner's own disk (the runner sets
# npm_config_cache, UV_CACHE_DIR and UV_PYTHON_INSTALL_DIR; the e2e and lhci containers set
# npm_config_cache to the same folder under /__w), so setup-node's GitHub cache is off for these
# jobs: restoring and saving it over the Mac's connection took minutes. Put `cache: npm` back when
# switching back. The time limits come from the first run on a loaded Mac with cold caches: npm ci
# up to 9 minutes, the first Node download 5, the first Python and wheels over 9.
# tests/unit/ci-runners.test.ts pins this layout.
jobs:
  static:
    name: Static checks and unit tests
    # Only on the runner instance labelled portfolio-mac-1, so two static jobs never run at once:
    # the runners share the Docker VM's network, where port 16389 can be published only once.
    runs-on: [self-hosted, linux, arm64, portfolio-mac, portfolio-mac-1]
    # 25, not 15: on the Mac's Docker VM `npm ci` alone took 2 to 8 minutes, depending on the load.
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.2
        # Loopback only: unbound, Docker Desktop would publish the port on every interface of the
        # Mac. It stays fixed because Docker Desktop reports a port it picks by the Mac's number,
        # which is not the port in the Docker VM, where the runner's steps run.
        ports: ['127.0.0.1:16389:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:css
      # The CV checks read PDFs with python3 and pdftotext (poppler-utils); the Redis conformance step
      # below needs redis-cli (redis-tools). One apt-get update, with retries against mirror hiccups,
      # before the unit tests; the PDF tools' versions go to the log, and a missing tool fails here.
      - name: Install PDF and Redis client tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3 poppler-utils redis-tools
          python3 --version
          pdftotext -v
      - name: Synthetic PDF extraction
        run: python3 -I scripts/pdf-extraction-proof.py tests/fixtures/pdf/synthetic.pdf "Synthetic PDF extraction proof"
      - run: npm run test:cov
      - name: Redis conformance
        run: |
          redis-cli -p 16389 -2 --json ping
          redis-cli -p 16389 info server | grep -E '^redis_version:7\.2\.'
          REDIS_CONFORMANCE_URL=redis://127.0.0.1:16389 npm test -- tests/unit/experiment/redis-conformance.test.ts --reporter=default
      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-vitest
          path: reports/vitest.json
          if-no-files-found: error
          retention-days: 14

  stats-ref:
    name: Statistics reference data
    runs-on: [self-hosted, linux, arm64, portfolio-mac]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Regenerates the reference data from the pinned scipy/statsmodels into a temporary file and
      # compares it numerically with the committed reference.json (floats within 1e-9 relative,
      # everything else exact), so a last-digit difference in a platform's math library cannot fail
      # the build while a real change in a reference value does.
      - name: Regenerate the reference data
        working-directory: stats-ref
        run: uv run --locked generate.py "$RUNNER_TEMP/reference.fresh.json"
      - name: Check reference.json is up to date
        working-directory: stats-ref
        run: uv run --locked check_reference.py reference.json "$RUNNER_TEMP/reference.fresh.json"

  sources-remote:
    name: Pinned sources exist on GitHub
    runs-on: [self-hosted, linux, arm64, portfolio-mac]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # Fetches each pinned export from raw.githubusercontent.com and compares its sha256 with
      # sources.lock.json, so a commit that exists only on a laptop, or was force-pushed away, fails.
      - run: npm run sources:sync -- --verify-remote

  build:
    name: Production build
    runs-on: [self-hosted, linux, arm64, portfolio-mac]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - name: Check the build has no kitchen sink
        run: npm run assert:no-kitchen-sink
      - run: npm run lint:design
      # Fails if TRUTH_DENYLIST is missing; findings name a deny-list term only by its index, so
      # the public log never holds a term. The secret is not exposed to pull requests from forks,
      # where the audit fails with "TRUTH_DENYLIST missing in CI".
      - name: Truth audit
        run: npm run truth:audit
        env:
          TRUTH_DENYLIST: ${{ secrets.TRUTH_DENYLIST }}
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: End-to-end tests
    # Only on the instance labelled portfolio-mac-2, so the longest job never holds instance 1,
    # where static (a required check) has to run.
    runs-on: [self-hosted, linux, arm64, portfolio-mac, portfolio-mac-2]
    # The suite takes 37 to 49 minutes on a hosted runner (and longer while several PRs run at once);
    # at 50 it was cancelled mid-run. 90 leaves room for growth without hiding a hung run for long.
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # A job container is a sibling of the runner container, so the runner's caps do not reach it:
      # these hold it to 3 of the Docker VM's 8 CPUs and 5 GB. --ipc=host is what Playwright's
      # Docker guide recommends for Chromium. At 3.5 GB with Docker's 64 MB /dev/shm the heaviest
      # pages crashed the browser ("Target crashed"); at 4.5 GB with --ipc=host they passed, but
      # the container's memory peaked at its cap, hence 5 GB.
      options: --cpus 3 --memory 5120m --memory-swap 5120m --ipc=host
    env:
      # npm's cache on the runner's own disk (/__w is the runner's work folder), kept between jobs.
      npm_config_cache: /__w/_cache/npm
      # The `update-baselines` label on the PR regenerates every visual baseline in this container.
      # While the label is on, updateSnapshots is 'all', so the job is green whatever the visual
      # diffs are: remove the label (and commit the reviewed baselines) before merging. Removing it
      # re-runs CI, where a missing or different baseline fails (updateSnapshots is 'none' in CI).
      UPDATE_BASELINES: ${{ contains(github.event.pull_request.labels.*.name, 'update-baselines') && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      # Two workers: Playwright's default is half the CPUs it sees, which are the Docker VM's 8, not
      # the container's 3, and more workers than two time out on the live page in the Docker VM.
      - run: npm run test:e2e -- --workers=2
        env:
          HOME: /root
      # Only the JSON report is uploaded. test-results/ and playwright-report/ are deliberately
      # left out: Playwright traces record request headers, including the x-internal HMAC header.
      - name: Upload e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-e2e
          path: reports/e2e.json
          if-no-files-found: error
          retention-days: 14
      # Visual baselines, to download, review and commit (never generate them on a Mac). Only the
      # screenshots folder is uploaded, never test-results/ or traces.
      - name: Upload visual baselines
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__
          if-no-files-found: warn
          retention-days: 7

  lhci:
    name: Lighthouse CI
    # Last, so nothing else of this run competes for the Mac while Lighthouse measures. It still
    # runs when another job failed, as long as the build it measures exists.
    needs: [static, stats-ref, sources-remote, build, e2e, links, cv-pdf]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # Only on instance 2, so one Lighthouse run at a time; the runner's job-started hook holds the
    # Mac's heavy-work slot and waits (up to 40 minutes) until the other runner is idle.
    runs-on: [self-hosted, linux, arm64, portfolio-mac, portfolio-mac-2]
    timeout-minutes: 60
    # Chromium from the Playwright image (Lighthouse needs a browser; Google Chrome has no arm64
    # Linux build), 2 CPUs like GitHub's hosted runner for private repositories, shared memory from
    # the Docker VM for Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --cpus 2 --memory 3072m --memory-swap 3072m --ipc=host
    env:
      # npm's cache on the runner's own disk (/__w is the runner's work folder), kept between jobs.
      npm_config_cache: /__w/_cache/npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-build
          path: .next
      - run: npm ci
      # Runs against a local `next start` (see lighthouserc.json), which has no protection, so no
      # LHCI_EXTRA_HEADERS is set and no secret can end up in the uploaded reports.
      # LCP is asserted on the best of 5 runs ("optimistic"); the category scores stay on the median.
      # On localhost the framework chunks sometimes start evaluating before the first frame is
      # presented, and Lantern then charges all of their download to LCP: a random outlier of about
      # +500 ms that base main hits too. A real regression raises every run, so the best run still
      # fails; tests/unit/lighthouserc.test.ts pins this shape.
      # Calibrated to GitHub's hosted runner (CPU multiplier 2.8, empirical; see the script),
      # with a benchmark guard: a run measured on a busier machine than the calibration
      # fails as "machine too busy to measure", never as a budget failure. See the script.
      - name: Lighthouse (calibrated to the hosted runner)
        run: bash scripts/lhci-calibrated.sh
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-lhci
          path: reports/lhci
          if-no-files-found: error
          retention-days: 14

  links:
    name: Link check
    needs: build
    # Only on the instance labelled portfolio-mac-1, so two link checks never run at once: the
    # runners share the Docker VM's network, where `next start -p 3123` can listen only once.
    # Not in a job container: there the runner hands composite actions their host path as
    # github.action_path, so lychee-action's entrypoint is "No such file" (exit 127).
    runs-on: [self-hosted, linux, arm64, portfolio-mac, portfolio-mac-1]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-build
          path: .next
      - run: npm ci
      - name: Start the site
        run: |
          nohup npx next start -p 3123 > next-start.log 2>&1 &
          echo $! > next-start.pid
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://localhost:3123/; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready within 60 seconds" >&2
          cat next-start.log >&2
          exit 1
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml http://localhost:3123/
          fail: true
      - name: Stop the site
        if: ${{ always() }}
        run: |
          if [ -f next-start.pid ]; then
            kill "$(cat next-start.pid)" 2>/dev/null || true
          fi

  cv-pdf:
    name: CV PDF check
    runs-on: [self-hosted, linux, arm64, portfolio-mac]
    timeout-minutes: 5
    steps:
      # The pull request's own head commit, not the merge commit GitHub would check out, so HEAD in
      # the summary is the commit under review. On a push to main it is the pushed commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Reserved for the check of the real CV PDF; checker-only until that check and the PDF arrive
      # together (see the script). The deny-list goes to this step alone. The secret is not exposed
      # to pull requests from forks.
      - name: Actual CV PDF check (checker-only)
        env:
          TRUTH_DENYLIST: ${{ secrets.TRUTH_DENYLIST }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/cv-pdf-gate.sh

  build-isolation:
    name: Build token isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A synthetic stand-in for `vercel pull --environment=production`, made by a script so no
      # secret is needed and a later change can extend the fixture without editing this workflow:
      # project settings for an offline `vercel build` and an env file holding the three store
      # write credentials (KV_REST_API_TOKEN, KV_URL, REDIS_URL) and the read-only token. No
      # VERCEL_ENV on purpose: this job proves the environment isolation, it is not a rehearsal
      # of the production build.
      - name: Synthetic pulled environment
        run: bash scripts/build-isolation-fixture.sh
      # The deploy's own build wrapper, with the real Vercel CLI and Next build: it fails unless no
      # store write credential is in any Node process of the build and the read-only token reached
      # the Next build.
      - name: Production build without the store's write credentials
        env:
          VERCEL_TELEMETRY_DISABLED: '1'
        run: bash scripts/vercel-build-isolated.sh production
