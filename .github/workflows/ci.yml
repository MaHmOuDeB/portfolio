name: CI

on:
  # `labeled` and `unlabeled` re-run the checks when the `update-baselines` label is added or removed
  # (see the e2e jobs): removing it must re-run CI in the normal mode, where a wrong baseline fails.
  # Only `pull_request`, never `pull_request_target`: a pull request from a fork runs its own code
  # with a read-only token and without the repository's secrets.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# A newer push to the same pull request (refs/pull/<n>/merge) or to main cancels the run it
# supersedes. The event is part of the key, so a pull request run (a fork's included) and a push
# run on main never share a group. A fork's pull request runs its own copy of this file and could
# still name any group; the repository's approval setting for outside contributors covers that.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the token can only read the contents. No job needs more: the artifacts of this
# run and the Actions cache use the run's own runtime token, not these permissions.
permissions:
  contents: read

# Runners. Every job runs on GitHub's hosted runner (`runs-on: ubuntu-24.04`), the layout for a
# public repository: there the standard hosted runners are free, and every pull request, one from a
# fork included, runs on a disposable GitHub machine. In a private repository the same layout spends
# the account's hosted minutes. deploy.yml runs on the hosted runner too and holds the production
# secrets; it follows only a green push run on main.
# setup-node caches npm's download folder through GitHub's cache (`cache: npm`) in every job but
# lhci, which restores node_modules itself (its own key, exact match, checked against the lockfile)
# on pull requests and installs fresh on a push to main. A pull request's cache entries are scoped
# to that pull request, so one from a fork cannot reach main's.
# The end-to-end suite runs in 4 parallel shards ("End-to-end tests (shard n of 4)"), each in the
# pinned Playwright container. The "End-to-end tests" job, the required check, merges their blob
# reports into the one JSON report deploy.yml reads (report-e2e, reports/e2e.json), merges the
# baselines they regenerated into one visual-baselines artifact, and fails unless every shard
# passed.
# lhci measures on the hosted runner, where the Lighthouse budgets were calibrated (plain
# `npm run lhci`). It runs only after every other job has passed, and not while the
# `update-baselines` label is on or on a pull request commit that already passed it (see the job).
# The "Lighthouse gate" job turns each outcome into one result: a label skip fails as not measured,
# a skip on an earlier pass of the same commit passes, so a skipped lhci is never read as a pass.
# scripts/lhci-calibrated.sh and scripts/lhci-benchmark-guard.ts are not used by CI; they stay for
# local calibration runs on a Mac.
# The truth audit's deny-list secret is never printed, and its absence fails closed in this
# repository; on a pull request from a fork, which gets no secrets, the deny-list part is skipped
# with a notice and runs on the push to main (see the build job).
# Reports that deploy.yml reads (report-vitest, report-e2e, report-lhci) are kept 3 days on pull
# requests and longer on main pushes; the shards' blob reports and baselines live one day, and the
# visual baselines are uploaded only while the `update-baselines` label is on.
# tests/unit/ci-runners.test.ts pins this layout.
jobs:
  static:
    name: Static checks and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        # The tag pinned by its digest (the multi-platform index), so a re-pushed tag changes nothing.
        image: redis:7.2@sha256:5b816bb37d9707a70f10ef5002ecf8ee431750d397010fc4314c93dca887962f
        # Loopback only, on the fixed port the conformance step below and
        # docs/experiment/redis-conformance.md name.
        ports: ['127.0.0.1:16389:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:css
      # The CV checks read PDFs with python3 and pdftotext (poppler-utils); the Redis conformance step
      # below needs redis-cli (redis-tools). One apt-get update, with retries against mirror hiccups,
      # before the unit tests; the PDF tools' versions go to the log, and a missing tool fails here.
      - name: Install PDF and Redis client tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends python3 poppler-utils redis-tools
          python3 --version
          pdftotext -v
      - name: Synthetic PDF extraction
        run: python3 -I scripts/pdf-extraction-proof.py tests/fixtures/pdf/synthetic.pdf "Synthetic PDF extraction proof"
      - run: npm run test:cov
      - name: Redis conformance
        run: |
          redis-cli -p 16389 -2 --json ping
          redis-cli -p 16389 info server | grep -E '^redis_version:7\.2\.'
          REDIS_CONFORMANCE_URL=redis://127.0.0.1:16389 npm test -- tests/unit/experiment/redis-conformance.test.ts --reporter=default
      # deploy.yml reads it from the push run on main; on a pull request only a person might, so it
      # is kept 3 days there.
      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-vitest
          path: reports/vitest.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}

  stats-ref:
    name: Statistics reference data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # Regenerates the reference data from the pinned scipy/statsmodels into a temporary file and
      # compares it numerically with the committed reference.json (floats within 1e-9 relative,
      # everything else exact), so a last-digit difference in a platform's math library cannot fail
      # the build while a real change in a reference value does.
      - name: Regenerate the reference data
        working-directory: stats-ref
        run: uv run --locked generate.py "$RUNNER_TEMP/reference.fresh.json"
      - name: Check reference.json is up to date
        working-directory: stats-ref
        run: uv run --locked check_reference.py reference.json "$RUNNER_TEMP/reference.fresh.json"

  sources-remote:
    name: Pinned sources exist on GitHub
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fetches each pinned export from raw.githubusercontent.com and compares its sha256 with
      # sources.lock.json, so a commit that exists only on a laptop, or was force-pushed away, fails.
      - run: npm run sources:sync -- --verify-remote

  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      lhci-passed: ${{ steps.lhci-passed.outputs.cache-hit }}
    steps:
      # Whether Lighthouse already passed on this exact commit in an earlier run of this pull
      # request (the marker the lhci job saves after its assertions passed). A lookup only, nothing
      # is downloaded; a miss or a cache error leaves the output empty and Lighthouse runs. Never on
      # a push to main, which always measures. The `lhci-remeasure` label skips the lookup, so a
      # re-run measures again (or delete the marker: `gh cache delete lhci-passed-<sha>`). Code in
      # the pull request could save this key too (in its own pull request's cache scope); the push
      # to main still measures, so a forged marker cannot reach a deploy.
      - name: Look up a Lighthouse pass for this commit
        id: lhci-passed
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'lhci-remeasure') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lhci-passed
          key: lhci-passed-${{ github.sha }}
          lookup-only: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check the build has no kitchen sink
        run: npm run assert:no-kitchen-sink
      - run: npm run lint:design
      # The deny-list reaches this step alone and is never printed: findings name a deny-list term
      # only by its index, so the public log never holds a term. In this repository (a push, or a
      # pull request from one of its own branches) a missing or empty TRUTH_DENYLIST fails the step
      # before the audit runs. A pull request from a fork gets no secrets: there the audit runs
      # without the deny-list (CI=false makes the script skip it instead of failing), with a notice;
      # the push to main after the merge runs it in full and gates the deploy.
      - name: Truth audit
        env:
          TRUTH_DENYLIST: ${{ secrets.TRUTH_DENYLIST }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FORK_PR" = true ]; then
            echo "::notice title=Truth audit::Pull request from a fork: the TRUTH_DENYLIST secret is not available to it, so the deny-list check is skipped. The rest of the audit runs here; the push to main runs the deny-list."
            TRUTH_DENYLIST='' CI=false npm run truth:audit
          elif [ -z "${TRUTH_DENYLIST//[[:space:]]/}" ]; then
            echo "::error title=Truth audit::TRUTH_DENYLIST is missing or empty in this repository; failing closed."
            exit 1
          else
            npm run truth:audit
          fi
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  e2e-shard:
    name: End-to-end tests (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    # A shard runs about a quarter of the suite, which took 37 to 49 minutes in one job on the
    # 2-CPU hosted runner of a private repository; 30 leaves room for the container pull, npm ci
    # and the build without hiding a hung run for long.
    timeout-minutes: 30
    # Every shard runs to the end, so one failure does not hide another; the "End-to-end tests"
    # job below fails unless all of them passed.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      # The tag pinned by its digest (the multi-platform index), so a re-pushed tag changes nothing;
      # scripts/e2e-docker.sh uses the same tag locally.
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      # Shared memory from the host, as Playwright's Docker guide recommends for Chromium (Docker's
      # default 64 MB /dev/shm crashed the heaviest pages).
      options: --ipc=host
    env:
      # The `update-baselines` label on the PR regenerates every visual baseline in this container.
      # While the label is on, updateSnapshots is 'all', so the shards are green whatever the visual
      # diffs are: remove the label (and commit the reviewed baselines) before merging. Removing it
      # re-runs CI, where a missing or different baseline fails (updateSnapshots is 'none' in CI).
      UPDATE_BASELINES: ${{ contains(github.event.pull_request.labels.*.name, 'update-baselines') && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every baseline written after this marker was regenerated by this shard.
      - name: Mark the start of the tests
        run: touch "$RUNNER_TEMP/e2e-start"
      # Two workers on the runner's 4 CPUs (each shard also builds and serves the site). The blob
      # reporter replaces the config's JSON report; the "End-to-end tests" job merges the shards'
      # blobs into reports/e2e.json. --trace=off: a blob carries its tests' attachments, and a trace
      # records request headers (the x-internal HMAC header among them), so none is recorded here.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --workers=2 --reporter=list,blob --trace=off
        env:
          HOME: /root
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error
          retention-days: 1
      # Only while the `update-baselines` label is on: the baselines this shard wrote (newer than the
      # marker), at their paths under tests/e2e/__screenshots__. Each test runs in exactly one
      # shard, so no two shards write the same file. Never test-results/ or traces.
      - name: Collect the regenerated baselines
        if: ${{ !cancelled() && env.UPDATE_BASELINES == '1' }}
        run: |
          mkdir -p baselines-changed
          if [ -d tests/e2e/__screenshots__ ]; then
            (cd tests/e2e/__screenshots__ && find . -type f -newer "$RUNNER_TEMP/e2e-start" -exec cp --parents -t ../../../baselines-changed {} +)
          fi
          echo "Regenerated baselines in this shard: $(find baselines-changed -type f | wc -l | tr -d ' ')"
      - name: Upload the regenerated baselines
        if: ${{ !cancelled() && env.UPDATE_BASELINES == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines-shard-${{ matrix.shard }}
          path: baselines-changed
          if-no-files-found: ignore
          retention-days: 1

  e2e:
    name: End-to-end tests
    # The required check for the whole suite. `always()`: it also runs when a shard failed or the
    # run was cancelled, and then fails, because GitHub shows a skipped check as passing.
    needs: e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UPDATE_BASELINES: ${{ contains(github.event.pull_request.labels.*.name, 'update-baselines') && '1' || '0' }}
    steps:
      # The first steps keep the default condition: they are skipped in a cancelled run, where only
      # the last step runs (and fails).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download the shards' blob reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      # One JSON report for the whole suite, at the path the config's own JSON reporter uses, so
      # scripts/build-meta.ts reads the same counts and axe annotations as from a single run. It
      # exits 1 when a test failed, after writing the report.
      - name: Merge the reports
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/e2e.json
        run: npx --no-install playwright merge-reports --reporter=json all-blob-reports
      # Only the JSON report is uploaded. Blob internals, test-results/ and playwright-report/ are
      # deliberately left out. deploy.yml reads it from the push run on main; on a pull request only
      # a person might, so it is kept 3 days there.
      - name: Upload e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-e2e
          path: reports/e2e.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
      # Visual baselines, to download, review and commit (never generate them on a Mac): the
      # committed folder with every shard's regenerated baselines laid over it, the same folder a
      # single run would have left. Only while the `update-baselines` label is on.
      - name: Lay the shards' baselines over the committed ones
        if: ${{ !cancelled() && env.UPDATE_BASELINES == '1' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: visual-baselines-shard-*
          path: tests/e2e/__screenshots__
          merge-multiple: true
      - name: Upload visual baselines
        if: ${{ !cancelled() && env.UPDATE_BASELINES == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: tests/e2e/__screenshots__
          if-no-files-found: warn
          retention-days: 7
      - name: Every shard passed
        if: ${{ always() }}
        env:
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          if [ "$SHARDS" = success ]; then
            echo "Every end-to-end shard passed."
            exit 0
          fi
          echo "::error::Not every end-to-end shard passed (shards: ${SHARDS})."
          exit 1

  lhci:
    name: Lighthouse CI
    # It waits for every other job, the four e2e shards and their merge included, and runs only
    # when all of them passed: a red run is not merge evidence, and the workflow's concurrency
    # group cancels a superseded run, usually long before it gets here. The price is a few minutes
    # of wall-clock time after e2e.
    # It is skipped in two cases; the Lighthouse gate job below turns each into one unambiguous
    # result, so a skipped lhci is never read as a pass. (1) While the `update-baselines` label is
    # on: that run's e2e is green whatever the screenshots show, so the run is not merge evidence
    # and the gate fails it as "not measured"; the run after the label is removed is the one that
    # gates the merge. (2) On a pull request, when the build job found the marker of an earlier pass
    # on this exact commit (a label event, a re-run of all jobs): the gate passes only on that
    # proof. A push to main never uses the marker and always measures; the deploy reads its report.
    needs: [static, stats-ref, sources-remote, build, e2e-shard, e2e, links, cv-pdf, build-isolation]
    if: ${{ !cancelled() && needs.build.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.build.outputs.lhci-passed != 'true' && !contains(github.event.pull_request.labels.*.name, 'update-baselines') }}
    runs-on: ubuntu-24.04
    # Hosted runs took 71 to 167 seconds (55 runs, 2026-10-06 to 2026-11-10); 10 leaves room for a
    # node_modules cache miss and caps a hung run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The build job's output, built on the same runner image. It holds no native binary: the
      # server output loads only Next's own JavaScript and Node's built-in modules from
      # node_modules, which is restored or installed below.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-build
          path: .next
      # node_modules from GitHub's cache, for pull requests only. The key has a prefix no other job
      # uses, and only this job saves it: OS, architecture, the exact Node version (resolved from
      # .nvmrc; it also fixes the npm version) and the hash of package-lock.json and .npmrc,
      # restored by exact key (no restore-keys). A restored tree must then match the lockfile
      # exactly (scripts/check-node-modules.ts); on any mismatch, or without a hit, `npm ci` runs
      # (it deletes node_modules first). A push to main never restores: it always installs fresh
      # with `npm ci` and saves that tree for the pull requests if the key is new (a lookup only, so
      # the existing entry is not downloaded). This job holds no secret, so a tampered cache could
      # at worst falsify a pull request's Lighthouse result, and the push to main measures on a
      # fresh install.
      - name: node_modules cache key
        id: node
        env:
          KEY_PREFIX: lhci-hosted-node-modules-${{ runner.os }}-${{ runner.arch }}
          LOCK_HASH: ${{ hashFiles('package-lock.json', '.npmrc') }}
        run: echo "key=${KEY_PREFIX}-node-$(node --version)-${LOCK_HASH}" >> "$GITHUB_OUTPUT"
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.node.outputs.key }}
          lookup-only: ${{ github.event_name != 'pull_request' }}
      - name: Check the restored node_modules against the lockfile
        id: node-modules-check
        if: ${{ github.event_name == 'pull_request' && steps.node-modules.outputs.cache-hit == 'true' }}
        run: |
          if node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-node-modules.ts; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The restored node_modules does not match the lockfile; installing with npm ci."
          fi
      - if: ${{ steps.node-modules-check.outputs.ok != 'true' }}
        run: npm ci
      - name: Save node_modules
        if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.node.outputs.key }}
      # Runs against a local `next start` (see lighthouserc.json), which has no protection, so no
      # LHCI_EXTRA_HEADERS is set and no secret can end up in the uploaded reports.
      # LCP and the category scores are asserted on the median of 5 runs, measured with the throttling
      # applied in the browser rather than simulated (lighthouserc.json). A second assertion,
      # "pessimistic", fails when any run recorded no LCP value: Lighthouse CI would otherwise drop
      # that run and take the median of the rest. tests/unit/lighthouserc.test.ts pins this shape.
      - run: npm run lhci
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-lhci
          path: reports/lhci
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 7 }}
      # Only after every assertion passed: marks this exact commit as measured, so a later run of it
      # in this pull request skips the lhci job (see the build job's lookup).
      - name: Record the Lighthouse pass for this commit
        if: ${{ success() && github.event_name == 'pull_request' }}
        run: echo "$GITHUB_SHA" > .lhci-passed
      - name: Save the Lighthouse pass marker
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lhci-passed
          key: lhci-passed-${{ github.sha }}

  links:
    name: Link check
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: next-build
          path: .next
      - run: npm ci
      - name: Start the site
        run: |
          nohup npx next start -p 3123 > next-start.log 2>&1 &
          echo $! > next-start.pid
          for _ in $(seq 1 60); do
            if curl --silent --fail --output /dev/null http://localhost:3123/; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready within 60 seconds" >&2
          cat next-start.log >&2
          exit 1
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml http://localhost:3123/
          fail: true
      - name: Stop the site
        if: ${{ always() }}
        run: |
          if [ -f next-start.pid ]; then
            kill "$(cat next-start.pid)" 2>/dev/null || true
          fi

  cv-pdf:
    name: CV PDF check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The pull request's own head commit, not the merge commit GitHub would check out, so HEAD in
      # the summary is the commit under review. On a push to main it is the pushed commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # Reserved for the check of the real CV PDF; checker-only until that check and the PDF arrive
      # together (see the script, which does not read the deny-list yet). The deny-list goes to this
      # step alone. The secret is not exposed to pull requests from forks.
      - name: Actual CV PDF check (checker-only)
        env:
          TRUTH_DENYLIST: ${{ secrets.TRUTH_DENYLIST }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/cv-pdf-gate.sh

  build-isolation:
    name: Build token isolation
    # Like build: npm ci plus a Next build. Only synthetic values reach it (no secret).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A synthetic stand-in for `vercel pull --environment=production`, made by a script so no
      # secret is needed and a later change can extend the fixture without editing this workflow:
      # project settings for an offline `vercel build` and an env file holding the three store
      # write credentials (KV_REST_API_TOKEN, KV_URL, REDIS_URL) and the read-only token. It sets
      # VERCEL_ENV="preview" (a Vercel build without VERCEL_ENV fails on purpose) and no
      # VERCEL_PROJECT_PRODUCTION_URL: this job proves the environment isolation, it is not a
      # rehearsal of the production build.
      - name: Synthetic pulled environment
        run: bash scripts/build-isolation-fixture.sh
      # The deploy's own build wrapper, with the real Vercel CLI and Next build: it fails unless no
      # store write credential is in any Node process of the build and the read-only token reached
      # the Next build.
      - name: Production build without the store's write credentials
        env:
          VERCEL_TELEMETRY_DISABLED: '1'
        run: bash scripts/vercel-build-isolated.sh production

  lhci-gate:
    name: Lighthouse gate
    # One unambiguous Lighthouse result for this commit. It passes only when lhci passed in this
    # run, or, on a pull request without the `update-baselines` label, when lhci was skipped
    # because the marker of an earlier pass on this exact commit exists and names it. It fails when
    # lhci failed, or was skipped because another job (an e2e shard included: lhci needs them all)
    # failed or because `update-baselines` is on ("not measured"). Merge on this check, not on
    # "Lighthouse CI". `always()`: it also runs in a cancelled run and fails there, because GitHub
    # shows a skipped check as passing.
    needs: [build, lhci]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The marker itself (a few bytes), only when lhci was skipped on a pull request after the build
      # job found it; it must hold this commit's SHA.
      - name: Restore the Lighthouse pass marker
        id: marker
        if: ${{ github.event_name == 'pull_request' && needs.lhci.result == 'skipped' && needs.build.outputs.lhci-passed == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lhci-passed
          key: lhci-passed-${{ github.sha }}
      - name: Lighthouse result for this commit
        env:
          LHCI: ${{ needs.lhci.result }}
          EVENT: ${{ github.event_name }}
          BASELINES: ${{ contains(github.event.pull_request.labels.*.name, 'update-baselines') }}
          MARKER: ${{ steps.marker.outputs.cache-hit }}
        run: |
          if [ "$LHCI" = success ]; then
            echo "Lighthouse measured ${GITHUB_SHA} in this run and passed."
            exit 0
          fi
          if [ "$BASELINES" = true ]; then
            echo "::error::Not measured: Lighthouse is skipped while the update-baselines label is on. Remove the label; that run gates the merge."
            exit 1
          fi
          if [ "$EVENT" = pull_request ] && [ "$LHCI" = skipped ] && [ "$MARKER" = true ] \
            && [ "$(cat .lhci-passed 2>/dev/null)" = "$GITHUB_SHA" ]; then
            echo "Lighthouse passed on ${GITHUB_SHA} in an earlier run of this pull request (add the lhci-remeasure label to measure again)."
            exit 0
          fi
          echo "::error::No Lighthouse pass for ${GITHUB_SHA} (lhci: ${LHCI})."
          exit 1
